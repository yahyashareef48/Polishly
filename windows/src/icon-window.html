<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 36px;
      height: 36px;
      background: transparent;
      overflow: hidden;
    }

    #trigger {
      width: 30px;
      height: 30px;
      margin: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c6cf0, #5a4bd1);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 2px 12px rgba(124, 108, 240, 0.55);
      animation: pop-in 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    #trigger:hover {
      transform: scale(1.12);
      box-shadow: 0 4px 18px rgba(124, 108, 240, 0.75);
    }

    @keyframes pop-in {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <button id="trigger" title="Polishly — click to polish selected text">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </svg>
  </button>

  <script>
    const { invoke } = window.__TAURI__.core;

    document.getElementById('trigger').addEventListener('click', async () => {
      await invoke('show_popup');
    });

    // Dismiss if the window loses focus (user clicked elsewhere)
    window.addEventListener('blur', async () => {
      await invoke('hide_all_windows');
    });
  </script>
</body>
</html>
