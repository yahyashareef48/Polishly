      <stop offset="0%" style="stop-color:#7c6cf0"/>
      <stop offset="100%" style="stop-color:#5a4bd1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
