name: Build & Release Windows App

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./windows/src-tauri -> target

      - name: Generate icon files from browser icons
        shell: pwsh
        run: |
          Copy-Item browser/icons/icon128.png windows/assets/icon.png
          magick browser/icons/icon128.png -resize 256x256 windows/assets/icon.ico

      - name: Install frontend dependencies
        run: npm install
        working-directory: windows

      # On every push to master: just build and upload artifact for testing
      - name: Build (dev artifact)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: windows

      # On a version tag (v1.0.0, v1.2.3, etc): build, sign, publish GitHub Release
      - name: Build & Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: windows
          tagName: ${{ github.ref_name }}
          releaseName: Polishly ${{ github.ref_name }}
          releaseBody: |
            ## What's new
            See commit history for changes.

            ## Install / Update
            Download `Polishly_*_x64-setup.exe` below and run it.
            If you already have Polishly installed it will auto-update in the background — no action needed.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
